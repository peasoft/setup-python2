name: "Setup Python 2"
description: "Set up Python 2.7 and add the command-line tools to the PATH."
author: "peasoft"
runs:
  using: "composite"
  steps:
    - run: sudo apt-get purge -y python-is-python3 || true
      shell: bash
    - run: sudo apt-get install -y build-essential checkinstall curl libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev
      shell: bash
    - run: |
        curl -o /tmp/Python-2.7.18.tgz https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        tar -xvf /tmp/Python-2.7.18.tgz
        cd Python-2.7.18
        ./configure --enable-optimizations
        sudo make altinstall
        sudo ln -s /usr/local/bin/python2.7 /usr/bin/python
        sudo ln -s /usr/local/bin/python2.7 /usr/bin/python2
      shell: bash
